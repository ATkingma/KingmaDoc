[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "kingmadoc"
dynamic = ["version"]
description = "Feature docs for AI coding agents: a plan with C4 diagrams before the code, a verification doc after."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "KingmaDoc contributors" }]
keywords = ["documentation", "c4", "mermaid", "ai-agents", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ATkingma/KingmaDoc"
Issues = "https://github.com/ATkingma/KingmaDoc/issues"
Changelog = "https://github.com/ATkingma/KingmaDoc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kingmadoc = "kingmadoc.cli:main"

[tool.hatch.version]
path = "src/kingmadoc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kingmadoc"]

# Templates live at the repo root for easy editing; ship them inside the package.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "kingmadoc/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
