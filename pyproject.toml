[build-system]
requires = ["hatchling>=1.21", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "kingmadoc"
dynamic = ["version"]
description = "Feature docs for AI coding agents: a plan with C4 diagrams before the code, a verification doc after."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "KingmaDoc contributors" }]
keywords = ["documentation", "c4", "mermaid", "ai-agents", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ATkingma/KingmaDoc"
Issues = "https://github.com/ATkingma/KingmaDoc/issues"
Changelog = "https://github.com/ATkingma/KingmaDoc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16", "mypy>=2.0", "types-PyYAML"]

[project.scripts]
kingmadoc = "kingmadoc.cli:main"

# The version comes from the git tag (v0.2.0 -> 0.2.0). Commits after a tag on main are
# 0.<next minor>.0.devN, so every install from git has a higher version than the one
# before (pipx upgrade sees it). No local "+g<hash>" part: PyPI rejects it, and
# `kingmadoc --version` shows the commit anyway.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/kingmadoc"]

# The agent skills live in skill/ (easy to find on GitHub) and ship as package data, so
# `kingmadoc skills install` works after a plain pip install.
[tool.hatch.build.targets.wheel.force-include]
"skill/SKILL.md" = "kingmadoc/skills/kingmadoc/SKILL.md"
"skill/reference" = "kingmadoc/skills/kingmadoc/reference"
"skill/explaining-code" = "kingmadoc/skills/explaining-code"

# The sdist is the source of truth for rebuilding the package (and for distro
# packagers), so it keeps tests/docs/skill; only Claude Code dev tooling is left out.
[tool.hatch.build.targets.sdist]
exclude = [".claude"]

[tool.ruff]
line-length = 99
target-version = "py311"
# Fixture projects for the skill evaluations: sample code agents read, never run.
extend-exclude = ["evals/fixtures"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear (convention D1), bandit (G7).
select = ["E", "W", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and run fixed commands (git, d2, the CLI itself); so do dev scripts.
"tests/**" = ["S101", "S603", "S607"]
"scripts/**" = ["S603", "S607"]
".claude/**" = ["S603", "S607"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
