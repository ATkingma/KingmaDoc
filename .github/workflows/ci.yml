name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff, mypy, conventions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the version comes from the git tags (hatch-vcs)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: mypy --strict
        run: mypy
      - name: Skill variants up to date
        run: python scripts/build_skill_variants.py --check
      - name: Convention checker
        run: python .claude/skills/checking-conventions/scripts/check_conventions.py
      - name: Lock file up to date, no known vulnerabilities (pip-audit)
        run: |
          python -m pip install uv pip-audit
          uv lock --check
          uv export --frozen --all-extras --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the version comes from the git tags (hatch-vcs)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: CLI smoke test
        shell: bash
        run: |
          kingmadoc --help
          cd "$RUNNER_TEMP"
          kingmadoc init
          kingmadoc plan "Test feature." --no-input
          test -f docs/features/test-feature-plan.md
